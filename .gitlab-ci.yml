# Daily Stargazing P0 non-deploying development adapter.
# Editorial/publication behavior, production secrets, and deployment stay disabled.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages:
  - verify

default:
  interruptible: true

daily_verify:
  stage: verify
  image: python:3.12-bookworm
  before_script:
    - apt-get update && apt-get install -y git
    - python -m pip install --upgrade pip
    - pip install pytest pandas numpy pyarrow scikit-learn httpx openai python-dotenv feedparser tqdm requests
  script:
    - python -m pytest
    - git diff --check
