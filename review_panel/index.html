        <!-- 阶段3 · 微调(refine)：进入时才落盘。去AI化/编辑正文/重生成正文/重生成标题/定稿。 -->
        <div id="refine-stage" style="display:none;">
          <div id="copy-preview-toolbar" class="copy-preview-toolbar">
            <span class="copy-preview-label">预览宽度</span>
            <button type="button" class="copy-preview-btn active" data-preview="desktop">桌面</button>
            <button type="button" class="copy-preview-btn" data-preview="mobile">移动</button>
          </div>
          <div id="copy-content" class="copy-content" style="display:none;">
            <div id="copy-humanize-toggle-slot"></div>
            <div id="copy-headline" class="copy-headline"></div>
            <div id="copy-body" class="copy-body"></div>
            <div id="copy-actions-slot" class="copy-actions-slot"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer>本地面板 · 无鉴权 · 勿公网暴露</footer>

  <script>
    (function () {
      "use strict";

      var state = {
        date: null,
        panel: null,
        selection: null, // {news_slug, tmdb_id, title}
        lang: "en", // "en" | "zh"; pure front-end toggle, does not refetch data
        stage: "candidates", // 10.5.1：三态导航机 "candidates"(选片) | "pick"(选型) | "refine"(微调)
        copyPlatform: "xiaohongshu", // 9.7.3 D6：当前定稿展示区选中的平台 tab
        copyPreviewMode: "desktop", // "desktop" | "mobile"：只改变定稿预览宽度，不改变产物内容
        originalBody: "", // 9.7.4：/api/copy 返回的原版正文（headline 不参与 toggle，恒定显示）
        humanizedBody: null, // 9.7.4：去AI化正文；null 表示尚未生成
        humanizeView: "original", // "original" | "humanized"：当前展示哪一版
        headline: "", // 9.8.5：定稿标题（可被「重生成标题」覆盖，通过 state 驱动 renderCopyHeadline）
        editingBody: false, // 9.8.5：是否处于「编辑正文」textarea 模式
        copyOpInFlight: false, // 9.8.5：编辑/重生成正文/重生成标题 互斥锁，防止并发操作
        drafts: [], // 10.5：内存态只读草稿池 [{draft_id, headline, body}]（ADR-0017 D3）
        previewDraftId: null, // 10.5.1：pick 阶段「正在预览」的 draft_id（纯前端只读，零副作用）
        selectedDraftId: null, // 10.5：refine 阶段已落盘的主视角指针（D4）；唯一落盘点为「进入微调」
        combineChecked: [], // 10.5：勾选待合并的 draft_id（上限 2）
        draftOpInFlight: false, // 10.5：生成/选中/合并草稿 互斥锁
      };

      // 9.7.3 D6：目前只实装小红书，其余平台先占坑展示为 "coming soon"，
      // 新平台落地时只需把对应 key 挪进 ACTIVE_COPY_PLATFORMS。
      var COPY_PLATFORMS = [
        { key: "xiaohongshu", label: "小红书" },
        { key: "x", label: "X" },
        { key: "reddit", label: "Reddit" },
      ];
      var ACTIVE_COPY_PLATFORMS = ["xiaohongshu"];

      var els = {
        dateSelect: document.getElementById("date-select"),
        langToggle: document.getElementById("lang-toggle"),
        selectionStatus: document.getElementById("selection-status"),
        generateDraftsBtn: document.getElementById("generate-drafts-btn"),
        draftPoolSection: document.getElementById("draft-pool-section"),
        draftPoolTabs: document.getElementById("draft-pool-tabs"),
        draftPoolResult: document.getElementById("draft-pool-result"),
        combineDraftsBtn: document.getElementById("combine-drafts-btn"),
        errorBanner: document.getElementById("error-banner"),
        newsList: document.getElementById("news-list"),
        loadingState: document.getElementById("loading-state"),
        emptyState: document.getElementById("empty-state"),
        candidatesView: document.getElementById("candidates-view"),
        copyView: document.getElementById("copy-view"),
        copyBackBtn: document.getElementById("copy-back-btn"),
        copyPanelTitle: document.getElementById("copy-panel-title"),
        copySelectedTitle: document.getElementById("copy-selected-title"),
        copyPanel: document.getElementById("copy-panel"),
        copyPlatformTabs: document.getElementById("copy-platform-tabs"),
        copyEmptyState: document.getElementById("copy-empty-state"),
        pickStage: document.getElementById("pick-stage"),
        pickPreview: document.getElementById("pick-preview"),
        pickPreviewHeadline: document.getElementById("pick-preview-headline"),
        pickPreviewBody: document.getElementById("pick-preview-body"),
        pickPreviewWarnings: document.getElementById("pick-preview-warnings"),
        enterRefineBtn: document.getElementById("enter-refine-btn"),
        enterRefineResult: document.getElementById("enter-refine-result"),
        refineStage: document.getElementById("refine-stage"),
        copyContent: document.getElementById("copy-content"),
        copyPreviewToolbar: document.getElementById("copy-preview-toolbar"),
        copyHeadline: document.getElementById("copy-headline"),
        copyBody: document.getElementById("copy-body"),
        copyHumanizeSlot: document.getElementById("copy-humanize-toggle-slot"),
        copyActionsSlot: document.getElementById("copy-actions-slot"),
      };

      // ---------------------------------------------------------------------
      // 工具函数
      // ---------------------------------------------------------------------

      function escapeHtml(value) {
        var s = value === null || value === undefined ? "" : String(value);
        return s
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      // 把可能为 null/undefined/空字符串的字段统一变成空串，避免渲染出 "null"/"undefined"。
      function safeText(value) {
        if (value === null || value === undefined) return "";
        var s = String(value);
        if (s === "null" || s === "undefined") return "";
        return s;
      }

      function hasText(value) {
        return safeText(value).trim().length > 0;
      }

      // 按当前语言选文本；ZH 缺失时回退到 EN（纯前端状态切换，不重新请求数据）。
      function textFor(enValue, zhValue) {
        if (state.lang === "zh" && hasText(zhValue)) return zhValue;
        return enValue;
      }

      function formatPubTime(iso) {
        if (!hasText(iso)) return "";
        var d = new Date(iso);
        if (isNaN(d.getTime())) return safeText(iso);
        var pad = function (n) { return n < 10 ? "0" + n : String(n); };
        return (
          d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) +
          " " + pad(d.getHours()) + ":" + pad(d.getMinutes())
        );
      }

      function formatSimilarity(value) {
        if (value === null || value === undefined || isNaN(value)) return "—";
        return (Number(value) * 100).toFixed(1) + "%";
      }

      function scoreClass(score) {
        if (score === 2) return "score-2";
        if (score === 1) return "score-1";
        return "score-0";
      }

      function scoreLabel(score) {
        if (score === 2) return "JUDGE 2 · 强共振";
        if (score === 1) return "JUDGE 1 · 弱共振";
        if (score === 0) return "JUDGE 0";
        return "JUDGE —";
      }

      function showError(message) {
        els.errorBanner.textContent = "⚠ " + message;
        els.errorBanner.classList.add("visible");
      }

      function clearError() {
        els.errorBanner.classList.remove("visible");
        els.errorBanner.textContent = "";
      }

      // ---------------------------------------------------------------------
      // API 调用（严格对接契约字段名）
      // ---------------------------------------------------------------------

      function apiGet(url) {
        return fetch(url).then(function (res) {
          return res.json().catch(function () {
            throw new Error("响应不是合法 JSON（HTTP " + res.status + "）");
          }).then(function (body) {
            if (!res.ok) {
              var msg = (body && body.error) ? body.error : ("HTTP " + res.status);
              var err = new Error(msg);
              err.status = res.status;
              err.body = body;
              throw err;
            }
            return body;
          });
        });
      }

      function apiPost(url, payload) {
        return fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        }).then(function (res) {
          return res.json().catch(function () {
            throw new Error("响应不是合法 JSON（HTTP " + res.status + "）");
          }).then(function (body) {
            // 契约里 400/500 也返回结构化 JSON（ok:false + error/stderr），
            // 由调用方按业务语义处理，这里只在完全解析不出 JSON 时才当传输层错误抛出。
            return { status: res.status, ok: res.ok, body: body };
          });
        });
      }

      // 后端错误响应有两种形状：subprocess 类 handler 返回 {stderr}，校验/路由 404 返回 {error}。
      // 统一按 stderr → error → HTTP 状态 → 兜底 顺序提取，避免某一形状缺字段时前端把真实
      // 原因吞成无信息的「未知错误」（典型：连到未含新端点的旧 serve 实例时的 404 not found）。
      function apiErrorText(res) {
        var b = res && res.body;
        if (b && b.stderr) return b.stderr;
        if (b && b.error) return b.error;
        if (res && typeof res.status === "number") return "HTTP " + res.status;
        return "未知错误";
      }

      // 12.6.3 · 轮询最大次数与间隔。retry+judge 实测最长 ~132s；
      // 200 次 × 1500ms = 300s（5 分钟），留出约 2.3 倍余量，覆盖偶发慢请求/LLM 抖动。
      var JOB_POLL_MAX_ATTEMPTS = 200;
      var JOB_POLL_INTERVAL_MS = 1500;

      // 提交长任务：POST 拿 202+job_id，再交给 pollJob 轮询到终态。
      // 返回值形状与 apiPost 完全一致（{status, ok, body}），使调用方 .then(res=>res.ok&&res.body.ok)
      // 逻辑无需改动。提交阶段本身失败（非 202 / body.ok=false / 缺 job_id，例如连到旧版 serve
      // 未含新端点而拿到 404）时，直接把 submitRes 原样传下去，交调用方既有的 else 分支 / apiErrorText 处理。
      function submitJob(url, payload, kind) {
        return apiPost(url, payload).then(function (submitRes) {
          if (!submitRes.ok || !submitRes.body || !submitRes.body.job_id) {
            return submitRes;
          }
          return pollJob(submitRes.body.job_id);
        });
      }

      // 轮询 /api/job 到终态，把结果还原成与 apiPost 一致的 {status, ok, body} 形状。
      function pollJob(jobId) {
        return new Promise(function (resolve, reject) {
          var attempts = 0;

          function tick() {
            attempts += 1;
            apiGet("/api/job?job_id=" + encodeURIComponent(jobId))
              .then(function (body) {
                // apiGet 对 2xx 直接返回 body 本身（不是 {status,ok,body} 包装）。
                if (body && body.status === "running") {
                  if (attempts >= JOB_POLL_MAX_ATTEMPTS) {
                    reject(new Error("任务超时（轮询超过上限），请检查后端日志"));
                    return;
                  }
                  setTimeout(tick, JOB_POLL_INTERVAL_MS);
                  return;
                }
                if (body && body.status === "done") {
                  var result = body.result || {};
                  var httpStatus = result.http_status;
                  resolve({
                    status: httpStatus,
                    ok: httpStatus >= 200 && httpStatus < 300,
                    body: result.payload,
                  });
                  return;
                }
                if (body && body.status === "error") {
                  resolve({
                    status: 500,
                    ok: false,
                    body: { ok: false, stderr: body.stderr },
                  });
                  return;
                }
                // 未预期的响应形状：当作传输层错误，走调用方 .catch。
                reject(new Error("轮询任务状态返回未知形状（job_id=" + jobId + "）"));
              })
              .catch(function (err) {
                // apiGet 对非 2xx（如未知 job_id 的 404）会 throw；网络瞬断也会到这里。
                // 简单稳妥起见直接 reject，避免吞错，走调用方既有的 .catch(网络错误) 分支。
                reject(err);
              });
          }

          tick();
        });
      }

      // ---------------------------------------------------------------------
      // 渲染
      // ---------------------------------------------------------------------

      function renderDateOptions(dates) {
        els.dateSelect.innerHTML = "";
        dates.forEach(function (d) {
          var opt = document.createElement("option");
          opt.value = d;
          opt.textContent = d;
          els.dateSelect.appendChild(opt);
        });
      }

      function renderAgentBadges(agents) {
        if (!agents || !agents.length) return "";
        return agents.map(function (a) {
          return '<span class="agent-badge">' + escapeHtml(a) + "</span>";
        }).join("");
      }

      function renderCandidateLine(label, value, extraClass) {
        if (!hasText(value)) return "";
        return (
          '<div class="candidate-line' + (extraClass ? " " + extraClass : "") + '">' +
          '<span class="label">' + escapeHtml(label) + '</span>' +
          escapeHtml(safeText(value)) +
          "</div>"
        );
      }

      function candidateRadioName() {
        // 全天所有候选共享同一个 radio group（name 固定不随新闻/日期变化），
        // 由浏览器原生 radio 语义保证"全天唯一单选"：勾选任意一个会自动取消其它所有。
        return "daily-pick";
      }

      function renderCandidate(newsSlug, cand) {
        var tmdbId = cand.tmdb_id;
        var isSelected = !!(
          state.selection &&
          state.selection.news_slug === newsSlug &&
          String(state.selection.tmdb_id) === String(tmdbId)
        );
        var score = (cand.judge_score === 0 || cand.judge_score === 1 || cand.judge_score === 2)
          ? cand.judge_score
          : null;

        var radioId = "cand-" + newsSlug + "-" + tmdbId;

        var head =
          '<div class="candidate-head">' +
          '<div class="candidate-title-row">' +
          '<span class="candidate-title">' + escapeHtml(safeText(cand.title)) + '</span>' +
          (cand.release_year ? '<span class="candidate-year">' + escapeHtml(cand.release_year) + '</span>' : "") +
          (isSelected ? '<span class="picked-marker">★ 已选</span>' : "") +
          "</div>" +
          '<div class="candidate-meta-row">' +
          '<span class="score-badge ' + scoreClass(score) + '">' + scoreLabel(score) + '</span>' +
          (hasText(cand.language) ? '<span class="candidate-lang">' + escapeHtml(cand.language) + '</span>' : "") +
          '<span class="candidate-sim">sim ' + formatSimilarity(cand.similarity) + '</span>' +
          "</div>" +
          (hasText(cand.genres) ? '<div class="candidate-genres">' + escapeHtml(cand.genres) + '</div>' : "") +
          "</div>";

        var agents = renderAgentBadges(cand.resonance_agents);

        var body =
          head +
          (agents ? '<div class="candidate-agents">' + agents + '</div>' : "") +
          renderCandidateLine("类型", cand.judge_resonance_type) +
          renderCandidateLine("Overview", textFor(cand.overview, cand.overview_zh), "overview") +
          renderCandidateLine("Rationale", textFor(cand.judge_rationale, cand.judge_rationale_zh)) +
          (hasText(cand.movie_url)
            ? '<div class="candidate-line"><a class="candidate-link" href="' +
            escapeHtml(cand.movie_url) + '" target="_blank" rel="noopener noreferrer">movie_url ↗</a></div>'
            : "");

        return (
          '<div class="candidate' + (isSelected ? " is-selected" : "") + '" ' +
          'data-news-slug="' + escapeHtml(newsSlug) + '" data-tmdb-id="' + escapeHtml(tmdbId) + '">' +
          '<input type="radio" class="candidate-select" name="' + candidateRadioName() + '" ' +
          'id="' + escapeHtml(radioId) + '" ' + (isSelected ? "checked" : "") + ' ' +
          'data-news-slug="' + escapeHtml(newsSlug) + '" data-tmdb-id="' + escapeHtml(tmdbId) + '" ' +
          'data-title="' + escapeHtml(cand.title) + '" />' +
          '<label class="candidate-body" for="' + escapeHtml(radioId) + '">' + body + '</label>' +
          "</div>"
        );
      }

      function renderNewsCard(item) {
        var news = item.news || {};
        var metaParts = [];
        if (hasText(news.source_name)) metaParts.push(escapeHtml(news.source_name));
        var pub = formatPubTime(news.pub_time);
        if (pub) metaParts.push(escapeHtml(pub));
        var metaLine = metaParts.join(" · ");
        if (hasText(news.url)) {
          metaLine += (metaLine ? " · " : "") +
            '<a href="' + escapeHtml(news.url) + '" target="_blank" rel="noopener noreferrer">原文 ↗</a>';
        }

        var candidatesHtml = (item.candidates || [])
          .map(function (c) { return renderCandidate(item.slug, c); })
          .join("");

        if (!candidatesHtml) {
          candidatesHtml = '<div class="candidate-empty">' +
            escapeHtml(textFor(
              "No resonant candidates \u00b7 all scored 0 by judge",
              "无共振候选 \u00b7 全部候选被 judge 判为 0 分"
            )) + '</div>';
        }

        return (
          '<div class="news-card">' +
          '<div class="news-head">' +
          '<div class="news-head-top">' +
          '<span class="news-index">#' + escapeHtml(item.index) + '</span>' +
          '<span class="news-title">' + escapeHtml(safeText(textFor(news.title, news.title_zh))) + '</span>' +
          "</div>" +
          (metaLine ? '<div class="news-meta">' + metaLine + '</div>' : "") +
          (hasText(textFor(news.description, news.description_zh))
            ? '<div class="news-desc">' + escapeHtml(textFor(news.description, news.description_zh)) + '</div>'
            : "") +
          "</div>" +
          '<div class="candidate-list">' + candidatesHtml + "</div>" +
          "</div>"
        );
      }

      function renderPanel(panel) {
        state.panel = panel;
        var items = panel.news_items || [];
        if (!items.length) {
          els.newsList.innerHTML = "";
          els.emptyState.style.display = "block";
          return;
        }
        els.emptyState.style.display = "none";
        els.newsList.innerHTML = items.map(renderNewsCard).join("");
      }

      // ---------------------------------------------------------------------
      // 定稿展示区（9.7.3 D6）：platform tabs + GET /api/copy 渲染 headline/body
      // ---------------------------------------------------------------------

      function renderCopyPlatformTabs() {
        els.copyPlatformTabs.innerHTML = COPY_PLATFORMS.map(function (p) {
          var isActive = p.key === state.copyPlatform;
          var isDisabled = ACTIVE_COPY_PLATFORMS.indexOf(p.key) === -1;
          var cls = "copy-platform-tab" + (isActive ? " active" : "") + (isDisabled ? " disabled" : "");
          var title = isDisabled ? "coming soon" : "";
          return (
            '<button type="button" class="' + cls + '" data-platform="' + escapeHtml(p.key) + '" ' +
            (isDisabled ? "disabled " : "") +
            'title="' + escapeHtml(title) + '">' + escapeHtml(p.label) + "</button>"
          );
        }).join("");
      }

      function showCopyEmptyState(message) {
        els.copyContent.style.display = "none";
        els.copyPreviewToolbar.classList.remove("visible");
        if (els.pickPreview) els.pickPreview.style.display = "none";
        els.copyEmptyState.classList.remove("loading");
        els.copyEmptyState.style.display = "block";
        els.copyEmptyState.textContent = message || "尚未定稿";
      }

      // 10.5.1：草稿池扇出是「逐 persona 调 LLM」的长操作（可能一两分钟），必须给醒目的
      // 进行中反馈——把 copy-empty-state 切成 loading 态（大 spinner + 主副文案），而不是
      // 只靠 topbar 按钮上的小 spinner（用户停在选片视图时根本看不到）。
      function showCopyLoading(mainText, subText) {
        els.copyContent.style.display = "none";
        els.copyPreviewToolbar.classList.remove("visible");
        els.draftPoolSection.style.display = "none";
        if (els.pickPreview) els.pickPreview.style.display = "none";
        els.copyEmptyState.classList.add("loading");
        els.copyEmptyState.style.display = "flex";
        els.copyEmptyState.innerHTML =
          '<span class="spinner-lg"></span>' +
          '<span>' + escapeHtml(mainText || "处理中…") + '</span>' +
          (subText ? '<span class="loading-sub">' + escapeHtml(subText) + '</span>' : '');
      }

      function showCopyContent(headline, body) {
        els.copyEmptyState.style.display = "none";
        els.copyPreviewToolbar.classList.add("visible");
        els.copyContent.style.display = "block";
        state.headline = headline;
        renderCopyHeadline();
        renderCopyPreviewMode();
        renderHumanizeSlot();
        renderCopyBody();
        renderCopyActions();
      }

      // 9.8.5：headline 由 state 驱动，「重生成标题」只需改 state.headline 再调用本函数重渲染。
      function renderCopyHeadline() {
        els.copyHeadline.textContent = safeText(state.headline);
      }

      function renderCopyPreviewMode() {
        var isMobile = state.copyPreviewMode === "mobile";
        els.copyContent.classList.toggle("mobile-preview", isMobile);
        var buttons = els.copyPreviewToolbar.querySelectorAll(".copy-preview-btn");
        buttons.forEach(function (btn) {
          btn.classList.toggle("active", btn.getAttribute("data-preview") === state.copyPreviewMode);
        });
      }

      function onCopyPreviewToggle(evt) {
        var target = evt.target.closest ? evt.target.closest(".copy-preview-btn") : null;
        if (!target) return;
        var mode = target.getAttribute("data-preview");
        if (mode !== "desktop" && mode !== "mobile") return;
        if (mode === state.copyPreviewMode) return;
        state.copyPreviewMode = mode;
        renderCopyPreviewMode();
      }

      // 9.7.4：headline 不参与 toggle（原版/去AI化版只切换正文），body 依 state.humanizeView 显示。
      function renderCopyBody() {
        if (state.editingBody) {
          els.copyBody.innerHTML = '<textarea id="copy-body-editor" class="copy-body-editor">' +
            escapeHtml(state.originalBody) + "</textarea>";
          return;
        }
        var body = state.humanizeView === "humanized" && state.humanizedBody !== null
          ? state.humanizedBody
          : state.originalBody;
        els.copyBody.textContent = safeText(body);
      }

      // 9.8.5：编辑正文/重生成正文/重生成标题 三个操作按钮 + 去AI化按钮 的统一互斥锁，
      // 防止两个 LLM 操作同时在飞、或在编辑态下误触重生成。
      function setCopyOpButtonsDisabled(disabled) {
        var ids = ["edit-body-btn", "regen-body-btn", "regen-headline-btn", "humanize-btn"];
        ids.forEach(function (id) {
          var el = document.getElementById(id);
          if (el) el.disabled = disabled;
        });
      }

      function clearCopyOpResult() {
        var el = document.getElementById("copy-op-result");
        if (el) {
          el.className = "humanize-result";
          el.textContent = "";
        }
      }

      function showCopyOpResult(message, isFail) {
        var el = document.getElementById("copy-op-result");
        if (el) {
          el.className = "humanize-result" + (isFail ? " fail" : "");
          el.textContent = message;
        }
      }

      // 渲染「编辑正文」「重生成正文」「重生成标题」按钮行 + 结果提示 span。
      // 编辑态下改为渲染「保存」「取消」，并整体禁用重生成/去AI化，避免冲突操作。
      function renderCopyActions() {
        if (!els.copyActionsSlot) return;
        if (state.editingBody) {
          els.copyActionsSlot.innerHTML =
            '<button type="button" id="save-body-btn" class="copy-action-btn primary">保存</button>' +
            '<button type="button" id="cancel-body-btn" class="copy-action-btn">取消</button>' +
            '<span id="copy-op-result" class="humanize-result"></span>';
          var saveBtn = document.getElementById("save-body-btn");
          var cancelBtn = document.getElementById("cancel-body-btn");
          if (saveBtn) saveBtn.addEventListener("click", onSaveBody);
          if (cancelBtn) cancelBtn.addEventListener("click", onCancelEditBody);
          setCopyOpButtonsDisabled(true);
          return;
        }
        els.copyActionsSlot.innerHTML =
          '<button type="button" id="edit-body-btn" class="copy-action-btn">编辑正文</button>' +
          '<button type="button" id="regen-body-btn" class="copy-action-btn">重生成正文</button>' +
          '<button type="button" id="regen-headline-btn" class="copy-action-btn">重生成标题</button>' +
          '<span id="copy-op-result" class="humanize-result"></span>';
        var editBtn = document.getElementById("edit-body-btn");
        var regenBodyBtn = document.getElementById("regen-body-btn");
        var regenHeadlineBtn = document.getElementById("regen-headline-btn");
        if (editBtn) editBtn.addEventListener("click", onEditBodyClick);
        if (regenBodyBtn) regenBodyBtn.addEventListener("click", onRegenerateBody);
        if (regenHeadlineBtn) regenHeadlineBtn.addEventListener("click", onRegenerateHeadline);
        if (state.copyOpInFlight) setCopyOpButtonsDisabled(true);
      }

      // 点击「编辑正文」：进入编辑态。编辑只作用于原版正文（去AI化版是派生/只读产物），
      // 所以先强制切回原版视图，再把 #copy-body 换成 textarea。
      function onEditBodyClick() {
        if (state.copyOpInFlight) return;
        state.humanizeView = "original";
        state.editingBody = true;
        renderHumanizeSlot();
        renderCopyBody();
        renderCopyActions();
      }

      // 「取消」：退出编辑态，重渲染原版正文，不发请求。
      function onCancelEditBody() {
        state.editingBody = false;
        renderCopyBody();
        renderCopyActions();
      }

      // 「保存」：POST /api/edit-body，成功后覆盖 originalBody 并使去AI化版失效（D4：
      // 覆盖语义要求人工编辑后重置去AI化产物，逼迫总编重新生成或直接用新原版）。
      function onSaveBody() {
        var editor = document.getElementById("copy-body-editor");
        var newBody = editor ? editor.value : "";
        if (!hasText(newBody)) {
          showCopyOpResult("✗ 正文不能为空", true);
          return;
        }
        if (!state.selection) return;
        var saveBtn = document.getElementById("save-body-btn");
        var cancelBtn = document.getElementById("cancel-body-btn");
        if (saveBtn) {
          saveBtn.disabled = true;
          saveBtn.innerHTML = '<span class="spinner"></span>保存中…';
        }
        if (cancelBtn) cancelBtn.disabled = true;
        clearCopyOpResult();
        apiPost("/api/edit-body", {
          date: state.date,
          slug: state.selection.news_slug,
          platform: state.copyPlatform,
          body: newBody,
        })
          .then(function (res) {
            if (res.ok && res.body && res.body.ok) {
              state.originalBody = res.body.body;
              state.humanizedBody = null; // D4：编辑后清空去AI化版，触发 toggle 隐藏
              state.humanizeView = "original";
              state.editingBody = false;
              renderCopyHeadline();
              renderHumanizeSlot();
              renderCopyBody();
              renderCopyActions();
              showCopyOpResult("✓ 已保存", false);
            } else {
              var msg = apiErrorText(res);
              showCopyOpResult("✗ 保存失败：" + msg, true);
              if (saveBtn) {
                saveBtn.disabled = false;
                saveBtn.textContent = "保存";
              }
              if (cancelBtn) cancelBtn.disabled = false;
            }
          })
          .catch(function (err) {
            showCopyOpResult("✗ 请求失败（网络错误）：" + err.message, true);
            if (saveBtn) {
              saveBtn.disabled = false;
              saveBtn.textContent = "保存";
            }
            if (cancelBtn) cancelBtn.disabled = false;
          });
      }

      // 「重生成正文」：POST /api/regenerate target=body。LLM 耗时操作，全程锁定其余按钮。
      // 成功后同样清空去AI化版（D4），可反复点击，每次都是整份覆盖。
      function onRegenerateBody() {
        if (state.copyOpInFlight || !state.selection) return;
        state.copyOpInFlight = true;
        setCopyOpButtonsDisabled(true);
        clearCopyOpResult();
        var btn = document.getElementById("regen-body-btn");
        if (btn) btn.innerHTML = '<span class="spinner"></span>重生成中…';
        submitJob("/api/regenerate", {
          date: state.date,
          slug: state.selection.news_slug,
          platform: state.copyPlatform,
          target: "body",
        }, "regenerate")
          .then(function (res) {
            if (res.ok && res.body && res.body.ok) {
              state.originalBody = res.body.body;
              state.headline = res.body.headline;
              state.humanizedBody = null; // D4
              state.humanizeView = "original";
              renderCopyHeadline();
              renderHumanizeSlot();
              renderCopyBody();
              showCopyOpResult("✓ 正文已重生成", false);
            } else {
              var stderr = apiErrorText(res);
              showCopyOpResult("✗ 重生成失败：" + stderr, true);
            }
          })
          .catch(function (err) {
            showCopyOpResult("✗ 请求失败（网络错误）：" + err.message, true);
          })
          .finally(function () {
            state.copyOpInFlight = false;
            renderCopyActions();
          });
      }

      // 「重生成标题」：POST /api/regenerate target=headline（LLM 会参考当前正文）。
      // 成功后只改 headline，正文与去AI化版都不受影响。
      function onRegenerateHeadline() {
        if (state.copyOpInFlight || !state.selection) return;
        state.copyOpInFlight = true;
        setCopyOpButtonsDisabled(true);
        clearCopyOpResult();
        var btn = document.getElementById("regen-headline-btn");
        if (btn) btn.innerHTML = '<span class="spinner"></span>重生成中…';
        submitJob("/api/regenerate", {
          date: state.date,
          slug: state.selection.news_slug,
          platform: state.copyPlatform,
          target: "headline",
        }, "regenerate")
          .then(function (res) {
            if (res.ok && res.body && res.body.ok) {
              state.headline = res.body.headline;
              renderCopyHeadline();
              showCopyOpResult("✓ 标题已重生成", false);
            } else {
              var stderr = apiErrorText(res);
              showCopyOpResult("✗ 重生成失败：" + stderr, true);
            }
          })
          .catch(function (err) {
            showCopyOpResult("✗ 请求失败（网络错误）：" + err.message, true);
          })
          .finally(function () {
            state.copyOpInFlight = false;
            renderCopyActions();
          });
      }

      // 渲染「去AI化」按钮 + 原版/去AI化版 toggle。按钮态：
      // - 无 humanizedBody：只显示「去AI化」按钮（首次生成）
      // - 有 humanizedBody：额外显示 原版/去AI化版 toggle；按钮文案变「重新生成」
      function renderHumanizeSlot() {
        var hasHumanized = state.humanizedBody !== null;
        var toggleCls = "humanize-view-toggle" + (hasHumanized ? " visible" : "");
        els.copyHumanizeSlot.innerHTML =
          '<button type="button" id="humanize-btn" class="humanize-btn">' +
          (hasHumanized ? "重新生成" : "去AI化") + "</button>" +
          '<div class="' + toggleCls + '">' +
          '<button type="button" class="humanize-view-btn' +
          (state.humanizeView === "original" ? " active" : "") +
          '" data-view="original">原版</button>' +
          '<button type="button" class="humanize-view-btn' +
          (state.humanizeView === "humanized" ? " active" : "") +
          '" data-view="humanized">去AI化版</button>' +
          "</div>" +
          '<span id="humanize-result" class="humanize-result"></span>';

        var btn = document.getElementById("humanize-btn");
        if (btn) btn.addEventListener("click", onHumanize);

        var toggleWrap = els.copyHumanizeSlot.querySelector(".humanize-view-toggle");
        if (toggleWrap) {
          toggleWrap.addEventListener("click", function (evt) {
            var target = evt.target.closest ? evt.target.closest(".humanize-view-btn") : null;
            if (!target) return;
            var view = target.getAttribute("data-view");
            if (view === state.humanizeView) return;
            state.humanizeView = view;
            renderHumanizeSlot();
            renderCopyBody();
          });
        }
      }

      // 点击「去AI化」/「重新生成」：POST /api/rewrite，成功后覆盖 humanizedBody 并切到该视图；
      // 可反复点击重新生成（覆盖磁盘上的 humanized 文件与内存态），原版正文不受影响。
      function onHumanize() {
        if (state.copyOpInFlight || !state.selection) return;
        state.copyOpInFlight = true;
        setCopyOpButtonsDisabled(true); // 与重生成正文/标题共用互斥锁，去AI化进行中锁全组
        var btn = document.getElementById("humanize-btn");
        var resultEl = document.getElementById("humanize-result");
        if (btn) {
          btn.disabled = true;
          btn.innerHTML = '<span class="spinner"></span>改写中…';
        }
        if (resultEl) {
          resultEl.className = "humanize-result";
          resultEl.textContent = "";
        }
        submitJob("/api/rewrite", {
          date: state.date,
          slug: state.selection.news_slug,
          platform: state.copyPlatform,
        }, "rewrite")
          .then(function (res) {
            if (res.ok && res.body && res.body.ok) {
              state.humanizedBody = res.body.humanized_body;
              state.humanizeView = "humanized";
              renderHumanizeSlot();
              renderCopyBody();
            } else {
              var stderr = apiErrorText(res);
              renderHumanizeSlot();
              var errEl = document.getElementById("humanize-result");
              if (errEl) {
                errEl.className = "humanize-result fail";
                errEl.textContent = "✗ 去AI化失败：" + stderr;
              }
            }
          })
          .catch(function (err) {
            renderHumanizeSlot();
            var errEl = document.getElementById("humanize-result");
            if (errEl) {
              errEl.className = "humanize-result fail";
              errEl.textContent = "✗ 请求失败（网络错误）：" + err.message;
            }
          })
          .then(function () {
            state.copyOpInFlight = false;
            renderCopyActions(); // 解锁编辑/重生成按钮（renderHumanizeSlot 已在上面重建去AI化按钮）
          });
      }

      // 10.5.1：三态导航机。candidates=选片列表；pick/refine 都在 #copy-view 内、互斥显示两个兄弟
      // 阶段区并共享 copy-panel-head。切阶段是纯视图操作，不触发任何后端副作用（落盘只发生在
      // 「进入微调」显式动作里）——这样 back 回退语义干净：refine→pick 丢弃微调态，pick→candidates。
      function switchStage(stage) {
        state.stage = stage;
        var isCopy = stage === "pick" || stage === "refine";
        els.candidatesView.style.display = isCopy ? "none" : "block";
        els.copyView.style.display = isCopy ? "block" : "none";
        if (els.pickStage) els.pickStage.style.display = stage === "pick" ? "block" : "none";
        if (els.refineStage) els.refineStage.style.display = stage === "refine" ? "block" : "none";
        updateCopyHead();
      }

      // 头部随阶段变化：标题（选型/微调）+ 返回按钮文案（微调回选型 / 选型回选片）。
      function updateCopyHead() {
        if (els.copyPanelTitle) {
          els.copyPanelTitle.textContent = state.stage === "refine" ? "微调" : "选型";
        }
        if (els.copyBackBtn) {
          els.copyBackBtn.textContent = state.stage === "refine" ? "← 返回选型" : "← 返回选片";
        }
        if (state.selection && state.selection.title) {
          els.copySelectedTitle.textContent = "已选：" + state.selection.title;
        } else {
          els.copySelectedTitle.textContent = "";
        }
      }

      // 10.5.1 · 刷新恢复的核心分诊：以磁盘产物为唯一事实来源，决定落到哪个阶段。
      //   已落盘 selected_draft_id + copy 命中 → refine（微调）；
      //   有池但未选主视角 → pick（选型），预览首张；
      //   无池 → candidates（选片）。不依赖内存态残留。
      function loadCopy() {
        renderCopyPlatformTabs();
        if (!state.selection) {
          switchStage("candidates");
          return;
        }
        if (ACTIVE_COPY_PLATFORMS.indexOf(state.copyPlatform) === -1) {
          state.drafts = [];
          renderDraftPool();
          switchStage("pick");
          showCopyEmptyState("该平台暂未开放（coming soon）");
          return;
        }
        // 先把只读草稿池读回内存（刷新后 serve 内存没有池，磁盘是唯一来源）。
        var poolUrl = "/api/drafts?date=" + encodeURIComponent(state.date) +
          "&slug=" + encodeURIComponent(state.selection.news_slug) +
          "&platform=" + encodeURIComponent(state.copyPlatform);
        apiGet(poolUrl)
          .then(function (poolBody) {
            state.drafts = (poolBody && poolBody.drafts) || [];
            state.combineChecked = [];
            renderDraftPool();
            // 已落盘主视角（restoreSelection 从 selection.copies[platform].selected_draft_id 回填）
            // 且 copy 命中 → 直接进 refine；否则留在 pick。
            if (state.selectedDraftId) {
              return loadRefineCopy(true);
            }
            enterPickStage();
          })
          .catch(function (err) {
            state.drafts = [];
            renderDraftPool();
            if (state.selectedDraftId) {
              loadRefineCopy(true);
            } else {
              switchStage("candidates");
              showError("加载草稿池失败：" + err.message);
            }
          });
      }

      // 进入 pick（选型）阶段：有池则预览首张（或保持已选预览），无池提示先生成。
      function enterPickStage() {
        switchStage("pick");
        if (!state.drafts.length) {
          showCopyEmptyState("尚未生成草稿池，点右上角「生成草稿池」");
          return;
        }
        els.copyEmptyState.style.display = "none";
        var keep = state.previewDraftId &&
          state.drafts.some(function (d) { return String(d.draft_id) === state.previewDraftId; });
        onPreviewDraft(keep ? state.previewDraftId : String(state.drafts[0].draft_id));
      }

      // 拉取已落盘当前稿进入 refine（微调）阶段。fromRestore=true 时 404 回退到 pick（选型），
      // 而非报错——刷新场景下 selected_draft_id 与 copy 产物可能因改选被清理。
      function loadRefineCopy(fromRestore) {
        var url = "/api/copy?date=" + encodeURIComponent(state.date) +
          "&slug=" + encodeURIComponent(state.selection.news_slug) +
          "&platform=" + encodeURIComponent(state.copyPlatform);
        return apiGet(url)
          .then(function (body) {
            state.originalBody = body.body || "";
            state.headline = body.headline || "";
            state.humanizedBody = body.has_humanized ? body.humanized_body : null;
            state.humanizeView = "original";
            state.editingBody = false;
            switchStage("refine");
            showCopyContent(body.headline, body.body);
          })
          .catch(function (err) {
            state.originalBody = "";
            state.humanizedBody = null;
            state.humanizeView = "original";
            if (err.status === 404) {
              state.selectedDraftId = null;
              enterPickStage();
            } else {
              switchStage("refine");
              showCopyEmptyState("加载定稿失败：" + err.message);
            }
          });
      }

      function renderSelectionStatus() {
        if (state.selection && state.selection.title) {
          els.selectionStatus.innerHTML = '已选：<span class="picked">' +
            escapeHtml(state.selection.title) + '</span>';
          els.generateDraftsBtn.disabled = state.draftOpInFlight;
        } else {
          els.selectionStatus.textContent = "尚未选定候选";
          els.generateDraftsBtn.disabled = true;
        }
      }

      // ---------------------------------------------------------------------
      // 10.5 · 草稿池：浏览多视角草稿 + 选主视角指针 + 合并 ≤2
      // ---------------------------------------------------------------------

      // 草稿池是内存态只读来源层（ADR-0017 D3）：一次生成后仅供浏览/点选，永不 mutate。
      // 换 candidate / 换日期时须清空——池与候选绑定，旧池对新候选无意义。
      function resetDraftPool() {
        state.drafts = [];
        state.previewDraftId = null;
        state.selectedDraftId = null;
        state.combineChecked = [];
        if (els.pickPreviewWarnings) {
          els.pickPreviewWarnings.innerHTML = "";
          els.pickPreviewWarnings.style.display = "none";
        }
        renderDraftPool();
      }

      function showDraftPoolResult(message, isFail) {
        if (!els.draftPoolResult) return;
        els.draftPoolResult.className = "draft-pool-result" + (isFail ? " fail" : "");
        els.draftPoolResult.textContent = message || "";
      }

      // 合并按钮仅在「恰好勾选 2 张」时可用（ADR-0017 D5 上限 2）；进行中或超限一律禁用。
      function renderCombineButton() {
        if (!els.combineDraftsBtn) return;
        var n = state.combineChecked.length;
        els.combineDraftsBtn.disabled = state.draftOpInFlight || n !== 2;
      }

      // 渲染草稿池标签行：每 persona 一个标签（仅 persona 名，正在预览的加 ★）；点标签只切换
      // 只读预览（onPreviewDraft，零副作用），不落盘。合并勾选框为次级 affordance（勾满 2 后其余禁用）。
      // 12.5 · body_lint rule_id → 人话标签（对齐 scripts/lib/body_lint.py 的 RULES 表意图描述）。
      // 表外 rule_id 兜底显示原始 id，避免新增红线时前端漏标。
      var _BODY_LINT_LABELS = {
        hard_transition: "硬转场套话（如「而这部…电影」）",
        parallel_dianpo: "「无论是…都…」式并列点破",
        verdict_stamp: "「同一种/同一个」式论点盖章",
        acceptance_standalone: "把接受度/口碑单独写成一整句",
      };

      // 12.5 · 草稿是否挂了非空 warnings（body_lint 红线或 judge 幻觉任一非空）。
      function hasWarnings(draft) {
        var w = draft && draft.warnings;
        if (!w || typeof w !== "object") return false;
        var lint = w.body_lint || [];
        var fab = w.fabrication || [];
        return (lint.length || 0) + (fab.length || 0) > 0;
      }

      // 12.5 · 是否可单份重试：合并稿（draft_id 含 +）后端 MVP 不支持，前端不显示重试按钮。
      function isRetryable(draftId) {
        return String(draftId).indexOf("+") === -1;
      }

      // 12.5 · 渲染预览区 warnings 详情块：列 body_lint 句式红线 + judge 幻觉 quote/reason，
      // 附「重试」按钮（合并稿隐藏）。无 warnings → 清空隐藏。纯展示，重试点击走事件委托。
      function renderDraftWarnings(draft) {
        var slot = els.pickPreviewWarnings;
        if (!slot) return;
        if (!hasWarnings(draft)) {
          slot.innerHTML = "";
          slot.style.display = "none";
          return;
        }
        var id = String(draft.draft_id);
        var w = draft.warnings;
        var lint = w.body_lint || [];
        var fab = w.fabrication || [];
        var parts = [];
        parts.push(
          '<div class="draft-warnings-head">' +
            '<span class="draft-warnings-title">⚠ 残余质量问题（重试耗尽后保留，供人工兜底）</span>' +
            (isRetryable(id)
              ? '<button type="button" id="draft-retry-btn" class="draft-retry-btn" data-draft-id="' +
                escapeHtml(id) + '">重试这一条</button>'
              : '<span class="enter-refine-hint">合并稿暂不支持单份重试</span>') +
          "</div>"
        );
        if (lint.length) {
          parts.push('<div class="draft-warnings-kind">句式红线（body_lint）</div>');
          parts.push('<ul class="draft-warnings-group">' + lint.map(function (rid) {
            return "<li>" + escapeHtml(_BODY_LINT_LABELS[rid] || String(rid)) + "</li>";
          }).join("") + "</ul>");
        }
        if (fab.length) {
          parts.push('<div class="draft-warnings-kind">幻觉细节（judge · overview 为唯一真值）</div>');
          parts.push('<ul class="draft-warnings-group">' + fab.map(function (f) {
            var quote = f && f.quote ? '「' + escapeHtml(String(f.quote)) + '」' : "";
            var reason = f && f.reason ? escapeHtml(String(f.reason)) : "";
            return "<li><span class=\"draft-warnings-quote\">" + quote + "</span>" +
              (reason ? " — " + reason : "") + "</li>";
          }).join("") + "</ul>");
        }
        parts.push('<div id="draft-retry-result" class="draft-retry-result"></div>');
        slot.innerHTML = parts.join("");
        slot.style.display = "block";
      }

      // 12.5 · 单份重试：POST /api/retry-draft 只重掷当前预览这一条（带 judge），成功后用回传池刷新，
      // 重新预览该条——warnings 归零则徽标与详情块随之消失。其它草稿零改动。
      function onRetryDraft(draftId) {
        if (state.draftOpInFlight || !state.selection) return;
        var id = String(draftId);
        state.draftOpInFlight = true;
        var btn = document.getElementById("draft-retry-btn");
        var resultEl = document.getElementById("draft-retry-result");
        if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>重试中…'; }
        if (resultEl) { resultEl.className = "draft-retry-result"; resultEl.textContent = "重掷中，稍候…"; }
        renderDraftPool();
        submitJob("/api/retry-draft", {
          date: state.date,
          slug: state.selection.news_slug,
          platform: state.copyPlatform,
          draft_id: id,
        }, "retry-draft")
          .then(function (res) {
            if (res.ok && res.body && res.body.ok) {
              state.drafts = res.body.drafts || state.drafts;
              state.previewDraftId = null;
              onPreviewDraft(id);
              var still = state.drafts.filter(function (d) { return String(d.draft_id) === id; })[0];
              var msg = still && hasWarnings(still)
                ? "✓ 已重掷（仍有残余问题，可再试或人工修）"
                : "✓ 已重掷，质量问题清零";
              showDraftPoolResult(msg, false);
            } else {
              var stderr = apiErrorText(res);
              var r1 = document.getElementById("draft-retry-result");
              if (r1) { r1.className = "draft-retry-result fail"; r1.textContent = "✗ 重试失败：" + stderr; }
            }
          })
          .catch(function (err) {
            var r2 = document.getElementById("draft-retry-result");
            if (r2) { r2.className = "draft-retry-result fail"; r2.textContent = "✗ 重试请求失败（网络错误）：" + err.message; }
          })
          .then(function () {
            state.draftOpInFlight = false;
            var b2 = document.getElementById("draft-retry-btn");
            if (b2) { b2.disabled = false; b2.innerHTML = "重试这一条"; }
            renderDraftPool();
          });
      }

      function renderDraftPool() {
        if (!els.draftPoolSection || !els.draftPoolTabs) return;
        if (!state.drafts.length) {
          els.draftPoolSection.style.display = "none";
          els.draftPoolTabs.innerHTML = "";
          renderCombineButton();
          return;
        }
        els.draftPoolSection.style.display = "block";
        var checkedFull = state.combineChecked.length >= 2;
        els.draftPoolTabs.innerHTML = state.drafts.map(function (d) {
          var id = String(d.draft_id);
          var isPreview = id === state.previewDraftId;
          var isChecked = state.combineChecked.indexOf(id) !== -1;
          var checkboxDisabled = state.draftOpInFlight || (checkedFull && !isChecked);
          var tabCls = "draft-tab" + (isPreview ? " selected" : "");
          var warnBadge = hasWarnings(d)
            ? '<span class="draft-tab-warn" title="该草稿有残余质量问题（句式红线 / 幻觉），点开预览查看并可重试">⚠</span>'
            : "";
          return (
            '<span class="' + tabCls + '" data-draft-id="' + escapeHtml(id) + '">' +
              '<button type="button" class="draft-tab-select" data-draft-id="' + escapeHtml(id) + '"' +
              (state.draftOpInFlight ? " disabled" : "") + ">" +
              (isPreview ? "★ " : "") + escapeHtml(id) + "</button>" +
              warnBadge +
              '<label class="draft-tab-combine" title="勾选后与另一个合并生成（上限 2）">' +
                '<input type="checkbox" class="draft-combine-cb" data-draft-id="' + escapeHtml(id) + '"' +
                (isChecked ? " checked" : "") + (checkboxDisabled ? " disabled" : "") + ">" +
              "</label>" +
            "</span>"
          );
        }).join("");
        renderCombineButton();
      }

      // 10.5.1 · 预览某视角草稿：纯前端只读，从内存池取 headline/body 渲染，零后端副作用。
      // 是 pick 阶段的唯一「切标签」行为——落盘推迟到「进入微调」。12.5 起附带 warnings 详情块。
      function onPreviewDraft(draftId) {
        if (state.draftOpInFlight) return;
        var id = String(draftId);
        var draft = state.drafts.filter(function (d) { return String(d.draft_id) === id; })[0];
        if (!draft) return;
        state.previewDraftId = id;
        els.copyEmptyState.style.display = "none";
        if (els.pickPreview) els.pickPreview.style.display = "block";
        if (els.pickPreviewHeadline) els.pickPreviewHeadline.textContent = safeText(draft.headline);
        if (els.pickPreviewBody) els.pickPreviewBody.textContent = safeText(draft.body);
        renderDraftWarnings(draft);
        if (els.enterRefineBtn) els.enterRefineBtn.disabled = state.draftOpInFlight;
        if (els.enterRefineResult) els.enterRefineResult.textContent = "";
        renderDraftPool();
      }

      // 10.5.1 · 「进入微调」：唯一落盘点。用当前预览的 previewDraftId 调 /api/select-draft 派生当前稿，
      // 成功后 selectedDraftId 落定、loadRefineCopy 拉磁盘稿进 refine 阶段，流入既有去AI化/编辑/重生成工作流。
      function onEnterRefine() {
        if (state.draftOpInFlight || !state.selection || !state.previewDraftId) return;
        state.draftOpInFlight = true;
        if (els.enterRefineBtn) {
          els.enterRefineBtn.disabled = true;
          els.enterRefineBtn.innerHTML = '<span class="spinner"></span>派生中…';
        }
        apiPost("/api/select-draft", {
          date: state.date,
          slug: state.selection.news_slug,
          platform: state.copyPlatform,
          draft_id: state.previewDraftId,
        })
          .then(function (res) {
            if (res.ok && res.body && res.body.ok) {
              state.selectedDraftId = String(res.body.selected_draft_id);
              return loadRefineCopy(false);
            }
            if (els.enterRefineResult) {
              els.enterRefineResult.className = "draft-pool-result fail";
              els.enterRefineResult.textContent = "✗ 进入微调失败：" + apiErrorText(res);
            }
          })
          .catch(function (err) {
            if (els.enterRefineResult) {
              els.enterRefineResult.className = "draft-pool-result fail";
              els.enterRefineResult.textContent = "✗ 请求失败（网络错误）：" + err.message;
            }
          })
          .then(function () {
            state.draftOpInFlight = false;
            if (els.enterRefineBtn) {
              els.enterRefineBtn.innerHTML = "进入微调 →";
              els.enterRefineBtn.disabled = !state.previewDraftId;
            }
          });
      }

      // 「生成草稿池」：POST /api/generate-drafts 全量扇出。成功后进入 pick（选型）阶段并预览首张；
      // 「选主视角」不再在这里发生——推迟到 pick 阶段点标签预览、再点「进入微调」才落盘。
      function onGenerateDrafts() {
        if (state.draftOpInFlight || !state.selection) return;
        state.draftOpInFlight = true;
        els.generateDraftsBtn.disabled = true;
        els.generateDraftsBtn.innerHTML = '<span class="spinner"></span>扇出中…';
        clearError();
        // 立即切进 pick 阶段并显示醒目 loading 态——扇出要逐个 persona 调模型，耗时较长，
        // 必须让总编看到「正在跑，请等待」，而不是停在选片视图对着一个不动的按钮。
        switchStage("pick");
        showCopyLoading(
          "正在为每个共鸣视角生成草稿…",
          "逐个调用模型，可能需要一两分钟，请稍候"
        );
        submitJob("/api/generate-drafts", {
          date: state.date,
          slug: state.selection.news_slug,
          platform: state.copyPlatform,
        }, "generate-drafts")
          .then(function (res) {
            if (res.ok && res.body && res.body.ok) {
              state.drafts = res.body.drafts || [];
              state.previewDraftId = null;
              state.selectedDraftId = null;
              state.combineChecked = [];
              renderDraftPool();
              showDraftPoolResult("✓ 生成 " + state.drafts.length + " 版草稿", false);
              enterPickStage();
            } else {
              var stderr = apiErrorText(res);
              showError("生成草稿池失败：" + stderr);
              switchStage("candidates");
            }
          })
          .catch(function (err) {
            showError("生成草稿池请求失败（网络错误）：" + err.message);
            switchStage("candidates");
          })
          .then(function () {
            state.draftOpInFlight = false;
            els.generateDraftsBtn.innerHTML = "生成草稿池";
            els.generateDraftsBtn.disabled = !state.selection;
            renderDraftPool();
          });
      }

      // 「合并生成」：POST /api/combine-drafts（恒单版）。成功后用回传的池刷新，追加一张合并卡；
      // 合并卡与普通草稿平权、可被预览/选为主视角。不自动切指针（需用户点标签预览再「进入微调」）。
      function onCombineDrafts() {
        if (state.draftOpInFlight || state.combineChecked.length !== 2) return;
        state.draftOpInFlight = true;
        renderDraftPool();
        els.combineDraftsBtn.innerHTML = '<span class="spinner"></span>合并中…';
        showDraftPoolResult("合并中…", false);
        submitJob("/api/combine-drafts", {
          date: state.date,
          slug: state.selection.news_slug,
          platform: state.copyPlatform,
          draft_ids: state.combineChecked.slice(),
        }, "combine-drafts")
          .then(function (res) {
            if (res.ok && res.body && res.body.ok) {
              state.drafts = res.body.drafts || state.drafts;
              state.combineChecked = [];
              showDraftPoolResult("✓ 已追加合并草稿", false);
            } else {
              var stderr = apiErrorText(res);
              showDraftPoolResult("✗ 合并失败：" + stderr, true);
            }
          })
          .catch(function (err) {
            showDraftPoolResult("✗ 请求失败（网络错误）：" + err.message, true);
          })
          .then(function () {
            state.draftOpInFlight = false;
            els.combineDraftsBtn.innerHTML = "合并生成";
            renderDraftPool();
          });
      }

      // ---------------------------------------------------------------------
      // 数据加载与交互
      // ---------------------------------------------------------------------

      function loadDates() {
        return apiGet("/api/dates").then(function (body) {
          var dates = body.dates || [];
          renderDateOptions(dates);
          if (dates.length) {
            state.date = dates[0];
            els.dateSelect.value = state.date;
            return loadDate(state.date);
          }
          els.emptyState.style.display = "block";
          els.emptyState.textContent = "没有可用的日批数据。";
        }).catch(function (err) {
          showError("加载日期列表失败：" + err.message);
        });
      }

      function loadDate(date) {
        clearError();
        state.date = date;
        state.selection = null;
        renderSelectionStatus();
        resetDraftPool();
        switchStage("candidates");
        els.loadingState.style.display = "block";
        els.newsList.innerHTML = "";
        els.emptyState.style.display = "none";

        return apiGet("/api/data?date=" + encodeURIComponent(date))
          .then(function (panel) {
            renderPanel(panel);
          })
          .catch(function (err) {
            var msg = (err.status === 404)
              ? "该日期无数据：" + (err.body && err.body.error ? err.body.error : err.message)
              : "加载数据失败：" + err.message;
            showError(msg);
          })
          .then(function () {
            els.loadingState.style.display = "none";
          })
          .then(function () {
            // 刷新后恢复：从磁盘 selection.json 恢复选中态，再让 loadCopy 按实际产物决定
            // 停在选片视图还是直接进定稿视图。修「产物已存在但界面不同步」的 desync bug。
            return restoreSelection(date);
          });
      }

      // 读已落盘 selection，回填 state.selection + 候选卡勾选态，然后按磁盘定稿产物切视图。
      function restoreSelection(date) {
        return apiGet("/api/selection?date=" + encodeURIComponent(date))
          .then(function (body) {
            var sel = body && body.selection;
            var picked = sel && sel.selected;
            if (!picked || !picked.news_slug) return;
            state.selection = {
              news_slug: picked.news_slug,
              tmdb_id: picked.tmdb_id,
              title: picked.title,
            };
            // 从磁盘 selection.copies[platform].selected_draft_id 回填主视角指针，作为 loadCopy
            // 分诊「落 refine 还是 pick」的依据——刷新后 pick 阶段也能凭它精确恢复到微调。
            var copyEntry = (sel.copies || {})[state.copyPlatform] || {};
            state.selectedDraftId = copyEntry.selected_draft_id
              ? String(copyEntry.selected_draft_id) : null;
            renderSelectionStatus();
            if (state.panel) renderPanel(state.panel);
            // loadCopy 三态分诊：已落盘主视角+copy命中→refine；有池未选→pick；无池→candidates。
            loadCopy();
          })
          .catch(function () {
            // selection 读取失败不阻塞主流程：留在选片视图即可。
          });
      }

      function onSelectCandidate(newsSlug, tmdbId, title) {
        clearError();
        return apiPost("/api/select", {
          date: state.date,
          news_slug: newsSlug,
          tmdb_id: tmdbId,
          title: title,
        }).then(function (res) {
          if (!res.ok) {
            var msg = (res.body && res.body.error) ? res.body.error : ("HTTP " + res.status);
            showError("选择失败：" + msg);
            return;
          }
          state.selection = { news_slug: newsSlug, tmdb_id: tmdbId, title: title };
          renderSelectionStatus();
          // 换候选：内存池对新候选无意义，清空（磁盘旧池不复用，需重新「生成草稿池」）。
          resetDraftPool();
          // 重渲染以更新每张卡上的"★ 已选"标记与高亮态。
          if (state.panel) renderPanel(state.panel);
          // 改选后旧定稿会被后端删除（G8），刷新定稿区避免展示陈旧内容。
          loadCopy();
        }).catch(function (err) {
          showError("选择请求失败（网络错误）：" + err.message);
        });
      }


      // ---------------------------------------------------------------------
      // 事件绑定
      // ---------------------------------------------------------------------

      els.dateSelect.addEventListener("change", function () {
        loadDate(els.dateSelect.value);
      });

      els.generateDraftsBtn.addEventListener("click", onGenerateDrafts);
      els.combineDraftsBtn.addEventListener("click", onCombineDrafts);
      if (els.enterRefineBtn) els.enterRefineBtn.addEventListener("click", onEnterRefine);

      // 12.5 · 重试按钮委托：warnings 详情块每次预览重建 DOM，故在稳定的 slot 上委托捕获点击。
      if (els.pickPreviewWarnings) {
        els.pickPreviewWarnings.addEventListener("click", function (evt) {
          var btn = evt.target.closest ? evt.target.closest("#draft-retry-btn") : null;
          if (!btn || btn.disabled) return;
          onRetryDraft(btn.getAttribute("data-draft-id"));
        });
      }

      // 事件委托：persona 标签点击 + 合并勾选框统一在 #draft-pool-tabs 捕获，
      // 避免每次 renderDraftPool 重建 DOM 后要逐个重绑监听器（同 #news-list 的委托模式）。
      // 10.5.1：点标签只切「只读预览」（onPreviewDraft，零副作用）；落盘推迟到「进入微调」。
      els.draftPoolTabs.addEventListener("click", function (evt) {
        var btn = evt.target.closest ? evt.target.closest(".draft-tab-select") : null;
        if (!btn || btn.disabled) return;
        onPreviewDraft(btn.getAttribute("data-draft-id"));
      });

      els.draftPoolTabs.addEventListener("change", function (evt) {
        var cb = evt.target;
        if (!cb.classList || !cb.classList.contains("draft-combine-cb")) return;
        var id = cb.getAttribute("data-draft-id");
        var idx = state.combineChecked.indexOf(id);
        if (cb.checked && idx === -1) {
          if (state.combineChecked.length >= 2) { cb.checked = false; return; }
          state.combineChecked.push(id);
        } else if (!cb.checked && idx !== -1) {
          state.combineChecked.splice(idx, 1);
        }
        // 重渲染以更新「勾满 2 后其余禁用」与合并按钮可用态。
        renderDraftPool();
      });

      // 10.5.1 · 两级返回：refine→pick（丢弃微调态回选型，磁盘已落盘的 copy/指针保留，可再进）；
      // pick→candidates（切回候选列表换 candidate，选中态与草稿池都保留）。
      els.copyBackBtn.addEventListener("click", function () {
        if (state.stage === "refine") {
          state.editingBody = false;
          enterPickStage();
        } else {
          switchStage("candidates");
        }
      });

      els.copyPlatformTabs.addEventListener("click", function (evt) {
        var btn = evt.target.closest ? evt.target.closest(".copy-platform-tab") : null;
        if (!btn || btn.disabled) return;
        var platform = btn.getAttribute("data-platform");
        if (platform === state.copyPlatform) return;
        state.copyPlatform = platform;
        loadCopy();
      });

      els.copyPreviewToolbar.addEventListener("click", onCopyPreviewToggle);

      // 纯前端语言切换：不重新请求 /api/data，只重渲染已加载的 panel。
      els.langToggle.addEventListener("click", function () {
        state.lang = state.lang === "en" ? "zh" : "en";
        els.langToggle.textContent = state.lang === "zh" ? "中 / EN" : "EN / 中";
        if (state.panel) renderPanel(state.panel);
      });

      // 事件委托：候选 radio 的 change 统一在 #news-list 上捕获，
      // 避免每次 renderPanel 重建 DOM 后要重新逐个绑定监听器。
      els.newsList.addEventListener("change", function (evt) {
        var target = evt.target;
        if (!target.classList || !target.classList.contains("candidate-select")) return;
        var newsSlug = target.getAttribute("data-news-slug");
        var tmdbId = target.getAttribute("data-tmdb-id");
        var title = target.getAttribute("data-title");
        onSelectCandidate(newsSlug, tmdbId, title);
      });

      renderCopyPlatformTabs();
      loadDates();
    })();
  </script>
