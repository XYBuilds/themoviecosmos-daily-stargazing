<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>每日星轨 · 审核面板</title>
  <style>
    :root {
      /* 编辑部深色主题：暗炭底 + 暖纸白文字 + 琥珀强调色，等宽字体点数据。 */
      --bg: #14130f;
      --bg-raised: #1b1a15;
      --bg-card: #201f19;
      --line: #37352a;
      --line-soft: #2a2920;
      --ink: #e8e3d4;
      --ink-dim: #a8a291;
      --ink-faint: #706a5a;
      --accent: #c98a3c;
      --accent-dim: #8a5f2c;
      --link: #d9b26a;
      --score-2-bg: #234d33;
      --score-2-fg: #8fe3ac;
      --score-2-border: #3a7a53;
      --score-1-bg: #3a3826;
      --score-1-fg: #cbc094;
      --score-1-border: #56502f;
      --score-0-bg: #262521;
      --score-0-fg: #7a7566;
      --score-0-border: #37352a;
      --danger-bg: #3d2222;
      --danger-fg: #f0a3a3;
      --danger-border: #6b3232;
      --ok-bg: #1f3a2a;
      --ok-fg: #9fdcb3;
      --ok-border: #3a6b4a;
      --mono: "SF Mono", "Cascadia Mono", "Consolas", "Menlo", "Liberation Mono", monospace;
      --sans: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 14px;
      line-height: 1.5;
    }

    #topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 20px;
      background: var(--bg-raised);
      border-bottom: 1px solid var(--line);
    }

    #topbar h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--ink);
      white-space: nowrap;
    }

    #topbar h1 .accent {
      color: var(--accent);
    }

    #date-select {
      background: var(--bg-card);
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 6px 10px;
      font-family: var(--mono);
      font-size: 13px;
    }

    #lang-toggle {
      background: var(--bg-card);
      color: var(--ink-dim);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 6px 10px;
      font-family: var(--mono);
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }

    #lang-toggle:hover {
      color: var(--ink);
      border-color: var(--accent-dim);
    }

    #selection-status {
      flex: 1;
      font-size: 13px;
      color: var(--ink-dim);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #selection-status .picked {
      color: var(--accent);
      font-weight: 600;
    }

    #generate-drafts-btn {
      background: var(--accent);
      color: #1a1408;
      border: none;
      border-radius: 4px;
      padding: 8px 18px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s ease;
    }

    #generate-drafts-btn:hover:not(:disabled) {
      background: #dd9c4f;
    }

    #generate-drafts-btn:disabled {
      background: var(--bg-card);
      color: var(--ink-faint);
      cursor: not-allowed;
      border: 1px solid var(--line);
    }

    #error-banner {
      display: none;
      background: var(--danger-bg);
      color: var(--danger-fg);
      border-bottom: 1px solid var(--danger-border);
      padding: 10px 20px;
      font-size: 13px;
    }

    #error-banner.visible {
      display: block;
    }

    #copy-view {
      max-width: 1600px;
      margin: 0 auto;
      padding: 20px 20px 80px;
    }

    .copy-panel {
      background: var(--bg-card);
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
    }

    .copy-back-btn {
      font-family: var(--mono);
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 4px;
      border: 1px solid var(--line);
      color: var(--ink-dim);
      background: var(--bg-card);
      cursor: pointer;
      white-space: nowrap;
    }

    .copy-back-btn:hover {
      color: var(--ink);
      border-color: var(--accent-dim);
    }

    .copy-selected-title {
      flex: 1;
      font-size: 12.5px;
      color: var(--accent);
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .copy-panel-head {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--line-soft);
      background: var(--bg-raised);
    }

    .copy-panel-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--ink);
      white-space: nowrap;
    }

    .copy-platform-tabs {
      display: flex;
      gap: 6px;
    }

    .copy-platform-tab {
      font-family: var(--mono);
      font-size: 11.5px;
      padding: 3px 10px;
      border-radius: 3px;
      border: 1px solid var(--line);
      color: var(--ink-dim);
      background: var(--bg-card);
      cursor: pointer;
      white-space: nowrap;
    }

    .copy-platform-tab.active {
      color: #1a1408;
      background: var(--accent);
      border-color: var(--accent);
      font-weight: 700;
      cursor: default;
    }

    .copy-platform-tab.disabled {
      color: var(--ink-faint);
      cursor: not-allowed;
      opacity: 0.6;
    }

    .copy-panel-body {
      padding: 16px 18px;
    }

    .copy-preview-toolbar {
      display: none;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      margin-bottom: 12px;
    }

    .copy-preview-toolbar.visible {
      display: flex;
    }

    .copy-preview-label {
      color: var(--ink-faint);
      font-family: var(--mono);
      font-size: 11px;
    }

    .copy-preview-btn {
      font-family: var(--mono);
      font-size: 11px;
      padding: 3px 9px;
      border-radius: 3px;
      border: 1px solid var(--line);
      color: var(--ink-dim);
      background: var(--bg-card);
      cursor: pointer;
      white-space: nowrap;
    }

    .copy-preview-btn.active {
      color: #1a1408;
      background: var(--accent);
      border-color: var(--accent);
      font-weight: 700;
      cursor: default;
    }

    .copy-content {
      max-width: none;
      transition: max-width 0.16s ease, padding 0.16s ease, border-color 0.16s ease;
    }

    .copy-content.mobile-preview {
      max-width: 390px;
      margin: 0 auto;
      padding: 18px 16px;
      border: 1px solid var(--line-soft);
      border-radius: 22px;
      background: #171611;
    }

    .copy-content.mobile-preview .copy-body {
      font-size: 13px;
      line-height: 1.75;
    }

    .copy-empty-state {
      color: var(--ink-faint);
      font-size: 13px;
      font-style: italic;
      text-align: center;
      padding: 24px 0;
    }

    .copy-empty-state.loading {
      color: var(--ink-dim);
      font-style: normal;
      padding: 48px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .copy-empty-state .spinner-lg {
      width: 26px;
      height: 26px;
      border: 3px solid var(--line);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    .copy-empty-state .loading-sub {
      font-size: 11.5px;
      color: var(--ink-faint);
    }

    #copy-humanize-toggle-slot {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .humanize-btn {
      font-family: var(--mono);
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 4px;
      border: 1px solid var(--line);
      color: var(--ink);
      background: var(--bg-card);
      cursor: pointer;
      white-space: nowrap;
    }

    .humanize-btn:hover:not(:disabled) {
      border-color: var(--accent);
      color: var(--accent);
    }

    .humanize-btn:disabled {
      color: var(--ink-faint);
      cursor: not-allowed;
    }

    .humanize-view-toggle {
      display: none;
      gap: 4px;
    }

    .humanize-view-toggle.visible {
      display: flex;
    }

    .humanize-view-btn {
      font-family: var(--mono);
      font-size: 11px;
      padding: 3px 9px;
      border-radius: 3px;
      border: 1px solid var(--line);
      color: var(--ink-dim);
      background: var(--bg-card);
      cursor: pointer;
      white-space: nowrap;
    }

    .humanize-view-btn.active {
      color: #1a1408;
      background: var(--accent);
      border-color: var(--accent);
      font-weight: 700;
      cursor: default;
    }

    .humanize-result {
      font-size: 11.5px;
      color: var(--ink-faint);
    }

    .humanize-result.fail {
      color: var(--danger-fg);
    }

    .copy-headline {
      font-size: 16px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 10px;
    }

    .copy-body {
      color: var(--ink);
      font-size: 13.5px;
      line-height: 1.7;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .copy-body-editor {
      width: 100%;
      min-height: 220px;
      box-sizing: border-box;
      color: var(--ink);
      font-size: 13.5px;
      line-height: 1.7;
      font-family: inherit;
      background: var(--bg-card);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 10px 12px;
      resize: vertical;
    }

    .copy-body-editor:focus {
      outline: none;
      border-color: var(--accent);
    }

    .copy-actions-slot {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--line-soft);
    }

    .copy-action-btn {
      font-family: var(--mono);
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 4px;
      border: 1px solid var(--line);
      color: var(--ink);
      background: var(--bg-card);
      cursor: pointer;
      white-space: nowrap;
    }

    .copy-action-btn:hover:not(:disabled) {
      border-color: var(--accent);
      color: var(--accent);
    }

    .copy-action-btn:disabled {
      color: var(--ink-faint);
      cursor: not-allowed;
    }

    .copy-action-btn.primary {
      border-color: var(--accent);
      color: #1a1408;
      background: var(--accent);
      font-weight: 700;
    }

    /* 10.5 · 草稿池浏览区：只读来源层（ADR-0017 D3），选主视角=可变指针（D4）。 */
    .draft-pool-section {
      margin-bottom: 16px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line-soft);
    }

    .draft-pool-head {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 12px;
    }

    .draft-pool-title {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--ink-dim);
    }

    .draft-pool-hint {
      font-size: 11.5px;
      color: var(--ink-faint);
    }

    .draft-pool-result {
      font-size: 11.5px;
      color: var(--ink-faint);
    }

    .draft-pool-result.fail {
      color: var(--danger-fg);
    }

    /* 草稿池 = persona 标签行：标签只显 persona 名，点即切主视角（D4 可变指针），
       派生的标题/正文由下方当前稿区显示——标签本身保持极简，不再重复正文预览。
       合并（D5）降为次级：pill 右侧分隔线 + 小勾选框，仅在勾满 2 后其余禁用。 */
    .draft-pool-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .draft-tab {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 8px 3px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--bg-card);
    }

    .draft-tab.selected {
      border-color: var(--accent);
      background: var(--accent);
    }

    .draft-tab-select {
      font-family: var(--mono);
      font-size: 11.5px;
      font-weight: 700;
      color: var(--accent);
      background: transparent;
      border: none;
      padding: 2px 0;
      cursor: pointer;
      white-space: nowrap;
    }

    .draft-tab-select:hover:not(:disabled) {
      text-decoration: underline;
    }

    .draft-tab-select:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    .draft-tab.selected .draft-tab-select {
      color: #1a1408;
    }

    .draft-tab-combine {
      display: inline-flex;
      align-items: center;
      padding-left: 6px;
      border-left: 1px solid var(--line);
      cursor: pointer;
    }

    .draft-tab.selected .draft-tab-combine {
      border-left-color: rgba(26, 20, 8, 0.3);
    }

    .draft-tab-combine input {
      cursor: pointer;
      margin: 0;
    }

    .draft-tab-combine input:disabled {
      cursor: not-allowed;
    }

    /* 12.5 · 标签 ⚠ 徽标：草稿挂 warnings（body_lint 红线 / judge 幻觉）时提示编辑该稿有残余问题。
       仅一个小图标，不挤标签行；详情在预览区展开。 */
    .draft-tab-warn {
      font-size: 12px;
      line-height: 1;
      cursor: help;
    }

    .draft-tab.selected .draft-tab-warn {
      filter: none;
    }

    .copy-action-btn.primary:hover:not(:disabled) {
      color: #1a1408;
    }

    /* 10.5.1 · pick(选型)阶段的只读预览区：展示当前预览视角的标题/正文（复用 copy-headline/body
       样式，纯只读，无编辑按钮），底部「进入微调」CTA 是唯一落盘入口。 */
    .pick-preview {
      margin-top: 4px;
    }

    .enter-refine-bar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--line-soft);
    }

    .enter-refine-hint {
      font-size: 11.5px;
      color: var(--ink-faint);
    }

    /* 12.5 · 预览区 warnings 详情块：run_publish 双闸门重试耗尽仍命中时挂在草稿上的残余问题
       （ADR-0019 D4 人工兜底）。列出 body_lint 句式红线与 judge 幻觉 quote/reason，附「重试」
       按钮让编辑只重掷这一条。合并稿不显示重试按钮（后端 MVP 不支持）。 */
    .draft-warnings {
      margin-top: 12px;
      padding: 12px 14px;
      border: 1px solid #a6603a;
      border-radius: 6px;
      background: rgba(166, 96, 58, 0.08);
    }

    .draft-warnings-head {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 8px;
    }

    .draft-warnings-title {
      font-size: 12.5px;
      font-weight: 700;
      color: #c47a4a;
    }

    .draft-warnings-group {
      margin: 6px 0 0;
      padding: 0;
      list-style: none;
    }

    .draft-warnings-group li {
      font-size: 12px;
      color: var(--ink);
      margin: 3px 0;
      padding-left: 14px;
      position: relative;
    }

    .draft-warnings-group li::before {
      content: "·";
      position: absolute;
      left: 4px;
      color: #c47a4a;
    }

    .draft-warnings-kind {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--ink-faint);
    }

    .draft-warnings-quote {
      color: #c47a4a;
    }

    .draft-retry-btn {
      margin-left: auto;
      font-family: var(--mono);
      font-size: 11.5px;
      font-weight: 700;
      color: #c47a4a;
      background: transparent;
      border: 1px solid #a6603a;
      border-radius: 999px;
      padding: 3px 12px;
      cursor: pointer;
    }

    .draft-retry-btn:hover:not(:disabled) {
      background: rgba(166, 96, 58, 0.18);
    }

    .draft-retry-btn:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    .draft-retry-result {
      font-size: 11.5px;
      margin-top: 6px;
    }

    #main {
      max-width: 1600px;
      margin: 0 auto;
      padding: 20px 20px 80px;
    }

    #empty-state,
    #loading-state {
      text-align: center;
      color: var(--ink-faint);
      padding: 60px 20px;
      font-size: 14px;
    }

    .news-card {
      background: var(--bg-card);
      border: 1px solid var(--line);
      border-radius: 6px;
      margin-bottom: 18px;
      overflow: hidden;
    }

    .news-head {
      padding: 14px 18px;
      border-bottom: 1px solid var(--line-soft);
    }

    .news-head-top {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .news-index {
      font-family: var(--mono);
      color: var(--accent);
      font-weight: 700;
      font-size: 13px;
    }

    .news-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--ink);
      flex: 1;
    }

    .news-meta {
      margin-top: 4px;
      font-size: 12px;
      color: var(--ink-faint);
      font-family: var(--mono);
    }

    .news-meta a {
      color: var(--link);
      text-decoration: none;
    }

    .news-meta a:hover {
      text-decoration: underline;
    }

    .news-desc {
      margin-top: 8px;
      color: var(--ink-dim);
      font-size: 13px;
      line-height: 1.55;
    }

    .candidate-list {
      padding: 10px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(480px, 1fr));
      gap: 12px;
      align-items: start;
    }

    @media (max-width: 680px) {
      .candidate-list {
        grid-template-columns: 1fr;
      }
    }

    .candidate {
      padding: 14px 16px;
      border: 1px solid var(--line-soft);
      border-radius: 5px;
      background: var(--bg-raised);
      display: flex;
      gap: 12px;
      align-items: flex-start;
      min-width: 0;
    }

    .candidate-select {
      margin-top: 3px;
      width: 15px;
      height: 15px;
      accent-color: var(--accent);
      cursor: pointer;
      flex-shrink: 0;
    }

    .candidate-body {
      flex: 1;
      min-width: 0;
    }

    .candidate-head {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .candidate-title-row {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 6px;
    }

    .candidate-title {
      font-weight: 700;
      color: var(--ink);
      font-size: 13.5px;
      line-height: 1.35;
    }

    .candidate-year {
      color: var(--ink-faint);
      font-family: var(--mono);
      font-size: 12px;
    }

    .candidate-meta-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 5px 8px;
    }

    .candidate-lang {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--ink-faint);
      border: 1px solid var(--line);
      border-radius: 3px;
      padding: 1px 5px;
      text-transform: uppercase;
    }

    .candidate-genres {
      color: var(--ink-faint);
      font-size: 11.5px;
      line-height: 1.4;
    }

    .candidate-sim {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--ink-dim);
    }

    .score-badge {
      display: inline-block;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      padding: 1px 7px;
      border-radius: 3px;
      border: 1px solid;
      letter-spacing: 0.02em;
    }

    .score-2 {
      background: var(--score-2-bg);
      color: var(--score-2-fg);
      border-color: var(--score-2-border);
    }

    .score-1 {
      background: var(--score-1-bg);
      color: var(--score-1-fg);
      border-color: var(--score-1-border);
    }

    .score-0 {
      background: var(--score-0-bg);
      color: var(--score-0-fg);
      border-color: var(--score-0-border);
    }

    .agent-badge {
      display: inline-block;
      font-family: var(--mono);
      font-size: 10.5px;
      color: var(--ink-dim);
      background: var(--bg-raised);
      border: 1px solid var(--line);
      border-radius: 3px;
      padding: 1px 6px;
      margin-right: 4px;
      margin-top: 4px;
    }

    .candidate-agents {
      margin-top: 2px;
    }

    .candidate-line {
      margin-top: 6px;
      font-size: 12.5px;
      color: var(--ink-dim);
      line-height: 1.5;
      max-width: 100%;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }

    .candidate-line .label {
      color: var(--ink-faint);
      font-family: var(--mono);
      font-size: 11px;
      text-transform: uppercase;
      margin-right: 6px;
    }

    .candidate-line.overview {
      color: var(--ink-dim);
    }

    .candidate-link {
      font-size: 12px;
      color: var(--link);
      text-decoration: none;
      font-family: var(--mono);
    }

    .candidate-link:hover {

    .picked-marker {
      display: inline-block;

      font-size: 11px;
      font-family: var(--mono);

    .candidate.is-selected {

    }

    .candidate-empty {
      padding: 16px 18px;
      color: var(--ink-faint);
      font-size: 12.5px;

    footer {
      max-width: 1600px;
      margin: 0 auto;

    .spinner {

<body>

  <div id="topbar">
    <h1><span class="accent">每日星轨</span> · 审核面板</h1>
    <select id="date-select" aria-label="选择日期"></select>

    <div id="selection-status">尚未选定候选</div>

  </div>

  <div id="error-banner"></div>

  <!-- 选片视图：候选列表。产出定稿后隐藏，切到 #copy-view。 -->
  <div id="candidates-view">
    <div id="main">
      <div id="loading-state" style="display:none;">加载中…</div>
      <div id="empty-state" style="display:none;">当天没有新闻数据。</div>
      <div id="news-list"></div>

  </div>

  <!-- 定稿视图：分两阶段兄弟区，共享 copy-panel-head。pick(选型)=只读浏览多视角草稿池；
       refine(微调)=对选定主视角做去AI化/编辑/重生成/定稿。back 两级回退（见 switchStage）。 -->
  <div id="copy-view" style="display:none;">
    <div id="copy-panel" class="copy-panel">
      <div class="copy-panel-head">
        <button type="button" id="copy-back-btn" class="copy-back-btn">← 返回</button>
        <span id="copy-panel-title" class="copy-panel-title">选型</span>
        <span id="copy-selected-title" class="copy-selected-title"></span>
        <div id="copy-platform-tabs" class="copy-platform-tabs"></div>

      <div id="copy-panel-body" class="copy-panel-body">
        <div id="copy-empty-state" class="copy-empty-state">尚未定稿</div>

        <!-- 阶段2 · 选型(pick)：只读来源层（ADR-0017 D3）。点 persona 标签只切换只读预览，
             零副作用；勾选 ≤2 合并生成；「进入微调」是唯一落盘点（调 select-draft 派生当前稿）。 -->
        <div id="pick-stage" style="display:none;">
          <div id="draft-pool-section" class="draft-pool-section">
            <div class="draft-pool-head">
              <span class="draft-pool-title">草稿池 · 多视角</span>
              <span class="draft-pool-hint">点标签预览各视角；勾选 ≤2 合并生成</span>
              <button type="button" id="combine-drafts-btn" class="copy-action-btn" disabled>合并生成</button>
              <span id="draft-pool-result" class="draft-pool-result"></span>

            <div id="draft-pool-tabs" class="draft-pool-tabs"></div>

            <div class="enter-refine-bar">
              <button type="button" id="enter-refine-btn" class="copy-action-btn primary" disabled>进入微调 →</button>
              <span class="enter-refine-hint">以此视角为主视角，进入去AI化 / 编辑 / 重生成</span>

          </div>
